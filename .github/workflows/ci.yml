name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (rule library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check generated rules.ts is in sync with the Python rule library
        run: |
          python -m leanweaver.gen_rules_ts --out /tmp/rules.ts
          diff /tmp/rules.ts vscode-extension/src/generated/rules.ts

  extension:
    name: Extension (compile, test, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile
        working-directory: vscode-extension
        run: npm run compile

      - name: Integration tests (headless display)
        working-directory: vscode-extension
        run: xvfb-run -a npm test

      - name: Package .vsix
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies --out leanweaver-1.0.0.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leanweaver-1.0.0.vsix
          path: vscode-extension/leanweaver-1.0.0.vsix
          if-no-files-found: error
