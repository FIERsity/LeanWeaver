name = "VerboseZH"
defaultTargets = ["VerboseZH"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
pp.proofs.withType = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

# 用本地已编译的 verbose-lean4（避免重下 mathlib 重复编译）
[[require]]
name = "verbose"
path = "/Volumes/DataHub/Dev/verbose-lean4"

[[lean_lib]]
name = "VerboseZH"
globs = ["VerboseZH.*"]
