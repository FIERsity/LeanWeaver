[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanweaver"
version = "0.1.0"
description = "Make formal proofs readable to humans — Lean 4 Chinese error explainer & proof translator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FIERsity" }]
keywords = ["lean4", "theorem-proving", "formal-math", "ai4math", "chinese", "proof-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
repl = ["lean-interact>=0.1"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
leanweaver = "leanweaver.cli:main"

[tool.setuptools.packages.find]
include = ["leanweaver*"]

[tool.setuptools.package-data]
leanweaver = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
