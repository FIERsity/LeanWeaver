[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanweaver"
version = "0.6.0"
description = "纯规则、零 LLM 的 Lean 4 报错解释器。Rule-based, zero-LLM Lean 4 error explainer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FIERsity" }]
keywords = ["lean4", "theorem-proving", "formal-math", "proof-assistant", "error-explainer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
leanweaver = "leanweaver.cli:main"

[tool.setuptools.packages.find]
include = ["leanweaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
